# nginx in front of the gunicorn service in gunicorn.service. Put this
# location into the server block of your site, e.g. in
# /etc/nginx/sites-available/default, and keep the socket path in line with
# gunicorn.service. The node then answers at https://your.server/yournode/tap/
# so set DEPLOY_URL = 'https://your.server/yournode/tap/' in settings.py.

location /yournode/ {
    proxy_pass http://unix:/run/yournode/gunicorn.sock:/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # large queries take minutes; match gunicorn's -t
    proxy_read_timeout 300s;
    # stream the XML to the client instead of collecting it on disk first
    proxy_buffering off;

    gzip on;
    gzip_proxied any;
    gzip_types text/xml application/xml;
}
