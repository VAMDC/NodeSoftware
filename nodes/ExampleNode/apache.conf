# Apache 2.4 in front of the gunicorn service in gunicorn.service, as a
# proxy. Needs: sudo a2enmod proxy proxy_http headers deflate
# Put this into the VirtualHost of your site and keep the socket path in line
# with gunicorn.service. Set DEPLOY_URL = 'https://your.server/yournode/tap/'
# in settings.py.

ProxyPass        /yournode/ unix:/run/yournode/gunicorn.sock|http://localhost/ timeout=300
ProxyPassReverse /yournode/ unix:/run/yournode/gunicorn.sock|http://localhost/
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
<Location /yournode/>
    AddOutputFilterByType DEFLATE text/xml application/xml
</Location>
